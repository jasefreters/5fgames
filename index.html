<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
// Phones in Chrome's "Desktop site" mode ignore the viewport tag and lay the page out
// ~980px wide, so everything looks tiny. Detect that and zoom the page back up to fit.
(function () {
  function fit() {
    var sw = screen.width;
    var z = navigator.maxTouchPoints > 0 && sw < 760 && innerWidth > sw * 1.2 ? innerWidth / sw : 1;
    document.documentElement.style.zoom = z === 1 ? "" : z;
    document.documentElement.style.setProperty("--page-zoom", z);
    document.documentElement.classList.toggle("phone-zoom", z !== 1);
    window.PAGE_ZOOM = z;
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
<title>5F Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
    background: #12122b radial-gradient(circle at 20% 0%, #2d2a6e 0%, #12122b 55%) fixed;
    color: #fff; min-height: calc(100vh / var(--page-zoom, 1)); padding: 28px 16px 40px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  header h1 { font-size: clamp(40px, 9vw, 64px); letter-spacing: 1px; line-height: 1; }
  header h1 span { color: #ffd23f; text-shadow: 0 0 22px rgba(255,210,63,.55); }
  header p { color: #b9b7e6; margin-top: 10px; font-size: 16px; }

  .featured {
    display: flex; align-items: center; gap: 16px; text-decoration: none; color: #121212;
    background: #fff; border-radius: 18px; padding: 18px; margin-bottom: 26px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35); transition: transform .15s;
  }
  .featured:hover { transform: translateY(-3px); }
  .featured .emoji { font-size: 44px; }
  .featured .txt { flex: 1; }
  .featured .tag { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #d6262f; }
  .featured b { display: block; font-family: Georgia, serif; font-size: 24px; margin: 2px 0; }
  .featured small { color: #555; font-size: 14px; }
  .featured .go { background: #121212; color: #fff; border-radius: 99px; padding: 10px 18px; font-weight: 700; white-space: nowrap; }

  .search { display: block; width: 100%; max-width: 420px; margin: 0 auto 20px; padding: 12px 18px; border-radius: 99px; border: 2px solid #3d3a85; background: #1d1b45; color: #fff; font-size: 16px; outline: none; }
  .search:focus { border-color: #ffd23f; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .game {
    display: flex; flex-direction: column; text-decoration: none; color: #fff; border-radius: 16px; overflow: hidden;
    background: #1d1b45; border: 2px solid transparent; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .game:hover, .game:focus-visible { transform: translateY(-4px) rotate(-.5deg); border-color: #ffd23f; box-shadow: 0 10px 24px rgba(0,0,0,.4); outline: none; }
  .game .art { height: 100px; display: grid; place-items: center; font-size: 52px; }
  .game .body { padding: 12px 14px 14px; }
  .game b { display: block; font-size: 17px; line-height: 1.2; }
  .game small { display: block; color: #b9b7e6; font-size: 13px; margin-top: 4px; }
  .empty { text-align: center; color: #b9b7e6; padding: 30px; display: none; }
  footer { text-align: center; color: #7d7bb3; font-size: 13px; margin-top: 30px; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .game .art { height: 80px; font-size: 42px; }
    .game b { font-size: 15px; }
    .featured { flex-wrap: wrap; }
    .featured .go { width: 100%; text-align: center; }
  }
  /* Same phone layout when the page is zoomed up from Chrome's "Desktop site" mode */
  .phone-zoom header h1 { font-size: 40px; }
  .phone-zoom .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .phone-zoom .game .art { height: 80px; font-size: 42px; }
  .phone-zoom .game b { font-size: 15px; }
  .phone-zoom .featured { flex-wrap: wrap; }
  .phone-zoom .featured .go { width: 100%; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎮 <span>5F</span> Games</h1>
    <p>Games made by the kids of 5F. Pick one and play!</p>
  </header>

  <a class="featured" href="afl_daily_puzzles.html">
    <div class="emoji">🏉</div>
    <div class="txt">
      <div class="tag">New puzzles every day</div>
      <b>AFL Daily</b>
      <small>Goal Five · Footy Connections · Club Clues</small>
    </div>
    <div class="go">Play today's →</div>
  </a>

  <input class="search" id="search" type="search" placeholder="🔍 Search games or makers…" aria-label="Search games">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No games match that search.</div>

  <footer>Made with ❤️ by 5F</footer>
</div>

<script>
const GAMES = [
  { file: "bull_rush.html", title: "Bull Rush", sub: "Rugby League Edition", emoji: "🏉", color: "#0f7a3d" },
  { file: "rugby_league_26_mason_tyson.html", title: "Rugby League 26", by: "Mason & Tyson", emoji: "🏟️", color: "#1d4ed8" },
  { file: "guess_the_nrl_player_Kaiden.html", title: "Guess the NRL Player", by: "Kaiden", emoji: "🤔", color: "#7c3aed" },
  { file: "soccer_shooter_jax.html", title: "Soccer Shooter", by: "Jax", emoji: "⚽", color: "#16a34a" },
  { file: "the_netball_girls_AriaLailaMiki.html", title: "The Netball Girls", by: "Aria, Laila & Miki", emoji: "🏐", color: "#db2777" },
  { file: "haydens_bottle_flip_battle.html", title: "Bottle Flip Battle", by: "Hayden", emoji: "🍾", color: "#0891b2" },
  { file: "sonics_journey_kaleb.html", title: "Sonic's Journey", by: "Kaleb & Jaylen", emoji: "💨", color: "#2563eb" },
  { file: "bobs_adventure_delcan.html", title: "Bob's Adventure", by: "Delcan", emoji: "🗡️", color: "#b45309" },
  { file: "monster_forest_Sprsh.html", title: "Monster Forest", by: "Sprsh", emoji: "👾", color: "#15803d" },
  { file: "The_Hunting_game_HunterandConnor.html", title: "The Hunting Game", by: "Hunter & Connor", emoji: "🏹", color: "#4d7c0f" },
  { file: "survive_Edric.html", title: "SURVIVE", by: "Edric", emoji: "🔦", color: "#3f3f46" },
  { file: "farrah-and-ruby.html", title: "Farrah & Ruby", by: "Farrah & Ruby", emoji: "🤝", color: "#c026d3" },
  { file: "josephs_meteorite_challenge.html", title: "Meteorite Challenge", by: "Joseph", emoji: "☄️", color: "#ea580c" },
  { file: "bibijas_memory_game.html", title: "Memory Game", by: "Bibija", emoji: "🐾", color: "#e11d48" },
  { file: "isabellas_animal_trivia.html", title: "Animal Trivia", by: "Isabella", emoji: "🦁", color: "#ca8a04" },
  { file: "bigbang_quiz_grayson.html", title: "BIGBANG Ultimate Quiz", by: "Grayson", emoji: "🎤", color: "#9333ea" },
  { file: "fact_or_fib.html", title: "Fact or Fib?", sub: "Class Quiz", emoji: "🧐", color: "#0d9488" },
];

const grid = document.getElementById("grid");
grid.innerHTML = GAMES.map(g => `
  <a class="game" href="${g.file}" data-search="${(g.title + " " + (g.by || g.sub)).toLowerCase()}">
    <div class="art" style="background:${g.color}">${g.emoji}</div>
    <div class="body"><b>${g.title}</b><small>${g.by ? "by " + g.by : g.sub}</small></div>
  </a>`).join("");

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  let shown = 0;
  grid.querySelectorAll(".game").forEach(el => {
    const hit = el.dataset.search.includes(q);
    el.style.display = hit ? "" : "none";
    shown += hit;
  });
  document.getElementById("empty").style.display = shown ? "none" : "block";
});
</script>
</body>
</html>
