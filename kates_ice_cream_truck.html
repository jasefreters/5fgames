<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f48fb1">
<script>
// Phones in Chrome's "Desktop site" mode lay pages out ~980px wide; zoom back up to fit.
(function () {
  function fit() {
    var sw = screen.width;
    var z = navigator.maxTouchPoints > 0 && sw < 760 && innerWidth > sw * 1.2 ? innerWidth / sw : 1;
    document.documentElement.style.zoom = z === 1 ? "" : z;
    window.PAGE_ZOOM = z;
  }
  fit();
  addEventListener("resize", fit);
})();
</script>
<title>Kate's Ice-Cream Truck</title>
<style>
  :root { --pink: #ec407a; --pink2: #f8bbd0; --ink: #3a2230; --cream: #fff8ee; --mint: #a5e4d4; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #bfe9ff; color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; overscroll-behavior: none; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; color: var(--ink); }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---------- home ---------- */
  #home { align-items: center; overflow-y: auto; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  #homeCv { width: 100%; height: 44vh; min-height: 250px; display: block; flex-shrink: 0; }
  .back-link { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 12px; color: #1b5e20; text-decoration: none; font-weight: 800; font-size: 14px; background: rgba(255,255,255,.7); padding: 4px 10px; border-radius: 99px; z-index: 2; }
  .music-btn { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 12px; border: none; background: rgba(255,255,255,.8); border-radius: 99px; width: 44px; height: 44px; font-size: 22px; z-index: 2; }
  h1 { font-size: clamp(30px, 9vw, 46px); line-height: 1; color: #fff; text-shadow: 0 3px 0 var(--pink), 0 6px 0 #ad1457; text-align: center; margin: 10px 12px 4px; }
  .lead { text-align: center; font-weight: 700; margin: 2px 14px 10px; font-size: 16px; }
  .people { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 460px; padding: 0 12px; }
  .person { border: 4px solid #fff; background: #fff; border-radius: 20px; padding: 6px 2px 8px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .person img { width: 100%; max-width: 80px; display: block; margin: 0 auto; }
  .person:active { transform: scale(.95); }
  .freezer { width: 100%; max-width: 460px; margin-top: 14px; padding: 0 12px; }
  .freezer h3 { font-size: 16px; margin-bottom: 6px; }
  .shelf { display: flex; gap: 8px; overflow-x: auto; background: #e1f5fe; border: 3px solid #fff; border-radius: 16px; padding: 8px; min-height: 120px; }
  .shelf .empty { color: #78909c; font-weight: 700; font-size: 14px; align-self: center; margin: auto; }
  .shelf figure { flex-shrink: 0; width: 76px; text-align: center; font-size: 10px; font-weight: 700; }
  .shelf canvas { width: 76px; height: 100px; display: block; }

  /* ---------- make ---------- */
  #make { background: #bfe9ff; }
  .top { display: flex; align-items: center; gap: 8px; padding: calc(6px + env(safe-area-inset-top)) 10px 6px; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.08); z-index: 2; }
  .top .home { border: none; background: #fce4ec; border-radius: 12px; height: 38px; padding: 0 10px; font-weight: 800; }
  .steps { flex: 1; display: flex; justify-content: center; gap: 6px; }
  .steps span { width: 34px; height: 34px; border-radius: 50%; background: #eceff1; display: grid; place-items: center; font-size: 17px; }
  .steps span.on { background: var(--pink2); box-shadow: 0 0 0 3px var(--pink); }
  .steps span.done { background: #c8e6c9; }
  .top .music-btn { position: static; width: 38px; height: 38px; background: #fce4ec; font-size: 18px; }
  .stage { flex: 1; position: relative; min-height: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .say { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: #fff; border-radius: 16px; padding: 8px 14px; font-weight: 900; font-size: 17px; box-shadow: 0 3px 0 rgba(0,0,0,.12); text-align: center; max-width: 92%; pointer-events: none; transition: opacity .3s; }
  .panel { background: #fff; padding: 10px 10px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -2px 8px rgba(0,0,0,.1); z-index: 2; }
  .panel h3 { text-align: center; font-size: 17px; margin-bottom: 8px; }
  .choices { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .big { border: none; border-radius: 18px; padding: 10px 12px; font-size: 16px; font-weight: 900; background: #fce4ec; box-shadow: 0 4px 0 #f48fb1; min-width: 96px; }
  .big .e { display: block; font-size: 30px; }
  .big:active, .big.held { transform: translateY(3px); box-shadow: 0 1px 0 #f48fb1; }
  .big.sel { background: var(--pink); color: #fff; }
  .lever.choc { background: #8d5a3b; color: #fff; box-shadow: 0 4px 0 #4e2c18; }
  .lever.straw { background: #f48fb1; color: #fff; box-shadow: 0 4px 0 #c2185b; }
  .lever.van { background: #fff3d6; box-shadow: 0 4px 0 #e0c48a; }
  .lever { flex: 1; max-width: 130px; padding: 14px 6px; }
  .row2 { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .go { border: none; border-radius: 16px; padding: 12px 22px; font-size: 18px; font-weight: 900; background: #43a047; color: #fff; box-shadow: 0 4px 0 #1b5e20; }
  .go:disabled { opacity: .4; }
  .go.alt { background: #90a4ae; box-shadow: 0 4px 0 #546e7a; }
  .go:active { transform: translateY(3px); box-shadow: none; }
  .tops { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; max-height: 32vh; overflow-y: auto; padding: 2px; }
  .tops button { border: none; border-radius: 14px; background: #fff3e0; padding: 6px 2px; font-size: 11px; font-weight: 800; line-height: 1.1; box-shadow: 0 3px 0 #ffcc80; }
  .tops button .e { display: block; font-size: 26px; margin-bottom: 2px; }
  .tops button:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<section class="screen active" id="home">
  <a class="back-link" href="index.html">← All games</a>
  <button class="music-btn" id="musicHome" aria-label="Music on or off">🎵</button>
  <canvas id="homeCv"></canvas>
  <h1>Kate's Ice-Cream Truck</h1>
  <p class="lead">Who's making the ice-cream? 🍦</p>
  <div class="people" id="makers"></div>
  <div class="freezer"><h3>🧊 My freezer</h3><div class="shelf" id="shelf"></div></div>
</section>

<!-- ================= MAKE ================= -->
<section class="screen" id="make">
  <div class="top">
    <button class="home" id="homeBtn">🏠</button>
    <div class="steps" id="steps"><span>🍦</span><span>🥛</span><span>🌈</span><span>😋</span></div>
    <button class="music-btn" id="musicMake" aria-label="Music on or off">🎵</button>
  </div>
  <div class="stage"><canvas id="cv"></canvas><div class="say" id="say"></div></div>
  <div class="panel" id="panel"></div>
</section>

<script>
const $ = id => document.getElementById(id);
function show(id) { document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id)); if (id === "make") resize(); }
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const store = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v === null || v === undefined ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

// =====================================================================
//  SOUND: the ice-cream truck song (Greensleeves) and little effects
// =====================================================================
let AC = null, musicOn = store.get("icecream-music", true);

function tone(f, s, d, type = "sine", v = .2, f2) { const ac = audio(); if (!ac) return; const t = ac.currentTime + s, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .05); }
function noise(d, f, v = .2, type = "lowpass", s = 0) { const ac = audio(); if (!ac) return; const b = ac.createBuffer(1, ac.sampleRate * d, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < x.length; i++) x[i] = Math.random() * 2 - 1; const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime + s; src.buffer = b; fl.type = type; fl.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); src.connect(fl).connect(g).connect(ac.destination); src.start(t); }
let songUntil = 0, nextSongAt = 0;
function playSong() {
  if (!musicOn || !audio()) return;
  const A = 440, B = 494, C = 523, D = 587, E = 659, F = 698, G = 392, Gs = 415, Fs = 370, E4 = 330, q = .3;
  const tune = [[A, 1], [C, 2], [D, 1], [E, 1.5], [F, .5], [E, 1], [D, 2], [B, 1], [G, 1.5], [A, .5], [B, 1], [C, 2], [A, 1], [A, 1.5], [Gs, .5], [A, 1], [B, 2], [Gs, 1], [E4, 2], [A, 1],
    [C, 2], [D, 1], [E, 1.5], [F, .5], [E, 1], [D, 2], [B, 1], [G, 1.5], [A, .5], [B, 1], [C, 1.5], [B, .5], [A, 1], [Gs, 1.5], [Fs, .5], [Gs, 1], [A, 3]];
  let t = 0;
  tune.forEach(([f, l]) => { tone(f * 2, t, l * q * .9, "square", .035); tone(f, t, l * q * .9, "triangle", .07); t += l * q; });
  songUntil = performance.now() + t * 1000;
}
// "sometimes" the truck plays its song
setInterval(() => { if (musicOn && performance.now() > nextSongAt && AC) { playSong(); nextSongAt = performance.now() + 45000 + Math.random() * 40000; } }, 3000);
function setMusic(on) { musicOn = on; store.set("icecream-music", on); $("musicHome").textContent = $("musicMake").textContent = on ? "🎵" : "🔇"; if (on) { playSong(); nextSongAt = performance.now() + 45000 + Math.random() * 30000; } }
$("musicHome").onclick = $("musicMake").onclick = () => setMusic(!musicOn);
$("musicHome").textContent = $("musicMake").textContent = musicOn ? "🎵" : "🔇";
function sayAloud(text) { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.pitch = 1.4; u.lang = "en-AU"; speechSynthesis.speak(u); } catch (e) {} }

// =====================================================================
//  THE FAMILY (cartoon portraits)
// =====================================================================
function portrait(kind) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const circle = (x, y, r, f) => { g.fillStyle = f; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); };
  const L = {
    hazel: { skin: "#f7d6c4", hair: "#d8b06a", shirt: "#c7b2e8", style: "long" },
    abby: { skin: "#f7d6c4", hair: "#d4a95e", shirt: "#f48fb1", style: "curly" },
    kate: { skin: "#f9d9c8", hair: "#6b4a30", shirt: "#12a5b5", style: "messy" },
    mum: { skin: "#f6cfb6", hair: "#9a4a2a", shirt: "stripes", style: "wavy" },
    dad: { skin: "#f0c3a4", hair: "#86643f", shirt: "#c9775d", style: "side" },
  }[kind];
  // hair behind the head
  if (L.style === "long" || L.style === "wavy") {
    g.fillStyle = L.hair; g.beginPath(); g.moveTo(30, 52); g.quadraticCurveTo(30, 16, 64, 16); g.quadraticCurveTo(98, 16, 98, 52);
    g.lineTo(L.style === "wavy" ? 108 : 104, 122); g.lineTo(L.style === "wavy" ? 20 : 24, 122); g.closePath(); g.fill();
  }
  if (L.style === "curly") for (let i = 0; i < 16; i++) { const a = Math.PI * (0.85 + i / 15 * 1.3); circle(64 + Math.cos(a) * 36, 58 + Math.sin(a) * 38, 11, L.hair); }
  if (L.style === "curly") for (let i = 0; i < 6; i++) { circle(30 + (i % 2) * 6, 70 + i * 9, 10, L.hair); circle(98 - (i % 2) * 6, 70 + i * 9, 10, L.hair); }
  if (L.style === "messy") { g.fillStyle = L.hair; g.beginPath(); g.moveTo(30, 50); g.quadraticCurveTo(28, 18, 64, 18); g.quadraticCurveTo(102, 18, 100, 54); g.lineTo(104, 98); g.lineTo(24, 98); g.closePath(); g.fill(); }
  // clothes
  if (L.shirt === "stripes") {
    g.save(); g.beginPath(); g.moveTo(12, 128); g.quadraticCurveTo(16, 92, 64, 90); g.quadraticCurveTo(112, 92, 116, 128); g.closePath(); g.clip();
    for (let y = 88; y < 128; y += 8) { g.fillStyle = (y / 8) % 2 ? "#6b4a2e" : "#f3ecdc"; g.fillRect(0, y, 128, 8); }
    g.restore(); g.strokeStyle = "#d4af37"; g.lineWidth = 1.5; g.beginPath(); g.arc(64, 92, 12, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  } else if (kind === "kate") {
    g.fillStyle = L.skin; g.beginPath(); g.moveTo(14, 128); g.quadraticCurveTo(18, 92, 64, 90); g.quadraticCurveTo(110, 92, 114, 128); g.closePath(); g.fill();
    g.fillStyle = L.shirt; g.beginPath(); g.moveTo(36, 128); g.lineTo(42, 102); g.quadraticCurveTo(64, 110, 86, 102); g.lineTo(92, 128); g.closePath(); g.fill();
    g.strokeStyle = L.shirt; g.lineWidth = 3; g.beginPath(); g.moveTo(44, 103); g.lineTo(48, 90); g.moveTo(84, 103); g.lineTo(80, 90); g.stroke();
  } else {
    g.fillStyle = L.shirt; g.beginPath(); g.moveTo(14, 128); g.quadraticCurveTo(18, 92, 64, 90); g.quadraticCurveTo(110, 92, 114, 128); g.closePath(); g.fill();
    if (kind === "hazel") [[36, 112], [56, 104], [80, 108], [98, 118]].forEach(([x, y]) => { for (let a = 0; a < 5; a++) circle(x + Math.cos(a * 1.26) * 4, y + Math.sin(a * 1.26) * 4, 3, "#fff"); circle(x, y, 2.3, "#b79ad9"); });
  }
  // head
  g.fillStyle = L.skin; g.fillRect(56, 78, 16, 16);
  circle(34, 58, 7, L.skin); circle(94, 58, 7, L.skin); circle(64, 55, 30, L.skin);
  // fringe / top hair
  g.fillStyle = L.hair;
  if (L.style === "long") { g.beginPath(); g.moveTo(34, 50); g.quadraticCurveTo(36, 22, 64, 22); g.quadraticCurveTo(92, 22, 94, 50); g.quadraticCurveTo(80, 36, 66, 38); g.quadraticCurveTo(50, 36, 34, 50); g.fill(); }
  if (L.style === "curly") { for (let i = 0; i < 7; i++) circle(38 + i * 8.6, 30 + Math.sin(i) * 3, 9, L.hair); }
  if (L.style === "messy") { g.beginPath(); g.moveTo(33, 52); g.quadraticCurveTo(34, 22, 64, 22); g.quadraticCurveTo(96, 22, 96, 54); g.quadraticCurveTo(86, 34, 70, 40); g.quadraticCurveTo(56, 30, 44, 42); g.quadraticCurveTo(38, 46, 33, 52); g.fill();
    circle(48, 22, 7, L.hair); circle(80, 24, 6, L.hair); }
  if (L.style === "wavy") { g.beginPath(); g.moveTo(34, 54); g.quadraticCurveTo(34, 20, 64, 21); g.quadraticCurveTo(95, 20, 94, 54); g.quadraticCurveTo(88, 34, 66, 30); g.quadraticCurveTo(44, 34, 34, 54); g.fill(); }
  if (L.style === "side") { g.beginPath(); g.moveTo(34, 50); g.quadraticCurveTo(32, 22, 62, 21); g.quadraticCurveTo(96, 20, 95, 48); g.quadraticCurveTo(88, 34, 70, 34); g.quadraticCurveTo(52, 32, 42, 42); g.quadraticCurveTo(38, 46, 34, 50); g.fill(); }
  // face

  circle(46, 66, 5.5, kind === "kate" ? "rgba(240,110,110,.5)" : "rgba(240,128,128,.35)"); circle(82, 66, 5.5, kind === "kate" ? "rgba(240,110,110,.5)" : "rgba(240,128,128,.35)");
  if (kind === "mum") for (let i = 0; i < 10; i++) circle(50 + (i * 13) % 28, 62 + (i * 7) % 8, .9, "#c98a62");
  if (kind === "dad") { g.fillStyle = "#6b4a2b"; g.beginPath(); g.ellipse(64, 67, 11, 3.5, 0, 0, 7); g.fill(); }
  g.strokeStyle = "#8a3b3b"; g.lineWidth = 3; g.lineCap = "round"; g.beginPath(); g.arc(64, 64, 10, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();

const PEOPLE = [["Mum", "mum"], ["Dad", "dad"], ["Hazel", "hazel"], ["Kate", "kate"]];
const PICS = {}; PEOPLE.forEach(([, k]) => PICS[k] = portrait(k));
const PIC_IMG = {}; PEOPLE.forEach(([n, k]) => { const i = new Image(); i.src = PICS[k]; PIC_IMG[n] = i; });

// =====================================================================
//  ICE-CREAM DATA
// =====================================================================
const FLAVOURS = { choc: ["Chocolate", "#7a4426", "#5c311b"], straw: ["Strawberry", "#f7a1b5", "#e57f9a"], van: ["Vanilla", "#fff1cf", "#e8d3a4"] };
const CONES = { waffle: ["Waffle cone", "🧇"], sugar: ["Sugar cone", "🍦"], dipped: ["Choc-dipped", "🍫"] };
const RH = 11, MAXR = 20;   // soft-serve ring height and the most you can pour
const RAINBOW = ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa", "#ec407a", "#ffffff"];
const TOPPINGS = [
  { id: "sprinkles", name: "Sprinkles", e: "🌈", kind: "bits", n: 40 },
  { id: "popping", name: "Popping candy", e: "💥", kind: "bits", n: 30 },
  { id: "freckles", name: "Freckles", e: "🟤", kind: "bits", n: 7 },
  { id: "chocsauce", name: "Chocolate topping", e: "🍫", kind: "sauce", c: "#4a2511" },
  { id: "strawsauce", name: "Strawberry topping", e: "🍓", kind: "sauce", c: "#d81b60" },
  { id: "caramel", name: "Caramel", e: "🍯", kind: "sauce", c: "#d9902f" },
  { id: "nutella", name: "Nutella", e: "🌰", kind: "sauce", c: "#5a2d14" },
  { id: "pb", name: "Peanut butter", e: "🥜", kind: "sauce", c: "#c8893f" },
  { id: "milo", name: "Milo", e: "🟫", kind: "bits", n: 60 },
  { id: "sherbet", name: "Sherbet", e: "🍬", kind: "bits", n: 60 },
  { id: "oreo", name: "Oreo crumbs", e: "🍪", kind: "bits", n: 30 },
  { id: "mms", name: "M&Ms", e: "🔴", kind: "bits", n: 10 },
  { id: "gummy", name: "Gummy bears", e: "🧸", kind: "bits", n: 5 },
  { id: "marsh", name: "Marshmallows", e: "☁️", kind: "bits", n: 6 },
  { id: "strawb", name: "Strawberries", e: "🍓", kind: "bits", n: 4 },
  { id: "flake", name: "Flake", e: "🍫", kind: "stick" },
  { id: "wafer", name: "Wafer", e: "🧇", kind: "stick" },
  { id: "cherry", name: "Cherry on top", e: "🍒", kind: "top" },
];
const T = Object.fromEntries(TOPPINGS.map(t => [t.id, t]));

// =====================================================================
//  DRAWING AN ICE-CREAM (used for the big one and freezer thumbnails)
//  recipe: { cone, rings:[flavour...], adds:[{id, ...}] }  — positions are
//  stored relative to the top of the cone so they always line up.
// =====================================================================
function ringW(i, n) { return 62 * (1 - Math.pow(i / (n + 1.5), 1.7)) + 7; }
function ringX(i) { return Math.sin(i * 1.15) * 3; }
function drawCone(c, r, eatCone) {
  const h = 150 * (1 - eatCone);           // how much cone is left (eaten from the top)
  if (h <= 0) return;
  c.save();
  c.beginPath(); c.moveTo(-60, 0); c.lineTo(60, 0); c.lineTo(0, 150); c.closePath(); c.clip();
  c.beginPath(); c.rect(-70, 150 - h, 140, h + 2); c.clip();
  c.fillStyle = r.cone === "sugar" ? "#e9b86a" : "#dca55a"; c.fillRect(-70, 0, 140, 152);
  c.strokeStyle = "rgba(130,80,20,.45)"; c.lineWidth = 2.5;
  if (r.cone === "sugar") { for (let y = 14; y < 150; y += 14) { c.beginPath(); c.moveTo(-60, y); c.lineTo(60, y); c.stroke(); } }
  else { for (let k = -150; k < 150; k += 16) { c.beginPath(); c.moveTo(k, 0); c.lineTo(k + 150, 150); c.stroke(); c.beginPath(); c.moveTo(k, 0); c.lineTo(k - 150, 150); c.stroke(); } }
  if (r.cone === "dipped") { c.fillStyle = "#5c311b"; c.beginPath(); c.moveTo(-62, 0); c.lineTo(62, 0); c.lineTo(62, 26); for (let x = 60; x > -62; x -= 12) c.quadraticCurveTo(x - 3, 40, x - 6, 30); c.closePath(); c.fill(); }

  c.fillStyle = "#b3e5fc"; c.beginPath(); c.moveTo(94, -56); c.lineTo(124, -40); c.lineTo(94, -40); c.fill();
  c.fillStyle = "#ec407a"; c.fillRect(-96, -78, 120, 46); c.fillStyle = "#fff"; c.font = "bold 14px sans-serif"; c.textAlign = "center"; c.fillText("ICE-CREAM", -36, -50);
  for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? "#fff" : "#ec407a"; c.fillRect(-110 + i * 34, -98, 34, 10); }
  // the giant cone on the roof
  c.fillStyle = "#dca55a"; c.beginPath(); c.moveTo(-20, -98); c.lineTo(0, -60 + -38); c.lineTo(20, -98); c.lineTo(0, -132 + 60); c.fill();
  c.beginPath(); c.moveTo(-16, -110); c.lineTo(16, -110); c.lineTo(0, -92); c.fill();
  c.fillStyle = "#f7a1b5"; c.beginPath(); c.arc(0, -118, 14, 0, 7); c.fill(); c.fillStyle = "#fff1cf"; c.beginPath(); c.arc(0, -130, 10, 0, 7); c.fill();
  [[-70, 0], [60, 0]].forEach(([wx, wy]) => { c.fillStyle = "#37474f"; c.beginPath(); c.arc(wx, wy, 16, 0, 7); c.fill(); c.fillStyle = "#cfd8dc"; c.beginPath(); c.arc(wx, wy, 6, 0, 7); c.fill(); });
  if (x <= target && Math.floor(t * 2) % 2) { c.font = "22px sans-serif"; c.fillText("🎵", 40, -110); }
  c.restore();
}

// =====================================================================
//  HOME: makers + the freezer of past ice-creams
// =====================================================================
function renderHome() {
  $("makers").innerHTML = PEOPLE.map(([n, k]) => `<button class="person" data-m="${n}"><img src="${PICS[k]}" alt="">${n}</button>`).join("");
  $("makers").querySelectorAll("[data-m]").forEach(b => b.onclick = () => { audio(); startMaking(b.dataset.m); });
  const saved = store.get("icecream-freezer", []), shelf = $("shelf");
  shelf.innerHTML = saved.length ? "" : `<span class="empty">Your ice-creams will be saved here 🍦</span>`;
  saved.forEach(r => {
    const f = document.createElement("figure"), cnv = document.createElement("canvas"); cnv.width = 152; cnv.height = 200;
    const g = cnv.getContext("2d"); g.scale(.46, .46); g.translate(165, 270); drawIceCream(g, r, 1e12, 0, 0);
    f.appendChild(cnv); f.append(`${r.name}`); shelf.appendChild(f);
  });
}
function goHome() { renderHome(); homeT0 = 0; show("home"); }
$("homeBtn").onclick = goHome;
renderHome();
requestAnimationFrame(render);
// the first tap anywhere starts the truck song
addEventListener("pointerdown", function first() { removeEventListener("pointerdown", first); audio(); if (musicOn) { playSong(); nextSongAt = performance.now() + 50000; } }, { once: true });
</script>
